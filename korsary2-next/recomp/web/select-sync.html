function b64ToBytes(lines) {
  const bin = atob(lines.join(''));
  const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}
async function sha256(buf) {
  const d = await crypto.subtle.digest('SHA-256', buf);
  return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, '0')).join('');
}
async function gameRoot(create) {
  return (await navigator.storage.getDirectory()).getDirectoryHandle(OPFS_DIR, { create });
}
async function fileHandle(dir, rel, create) {
  const parts = rel.split('/');
  for (const p of parts.slice(0, -1)) dir = await dir.getDirectoryHandle(p, { create });
  return dir.getFileHandle(parts.at(-1), { create });
}
async function readAll(rel) {
  try { return new Uint8Array(await (await (await fileHandle(await gameRoot(false), rel, false)).getFile()).arrayBuffer()); }
  catch { return null; }
}
async function writeAll(rel, bytes) {
  const w = await (await fileHandle(await gameRoot(true), rel, true)).createWritable();
  await w.write(bytes);
  await w.close();
  const got = await readAll(rel);
  if (!got || got.length !== bytes.length) throw new Error(rel + ': size mismatch after write');
  const h = await sha256(got);
  if (h !== await sha256(bytes)) throw new Error(rel + ': hash mismatch after write');
  return h;
}
async function serverPath(rel) {
  const m = await (await fetch('/game/manifest.json', { cache: 'no-store' })).json();
  const e = m.files.find(f => f.path.toLowerCase() === rel.toLowerCase());
  if (!e) throw new Error(rel + ': not in manifest');
  return e.path;
}
async function fetchServer(rel) {
  const p = await serverPath(rel);
  const res = await fetch('/game/' + p.split('/').map(encodeURIComponent).join('/'), { cache: 'no-store' });
  if (!res.ok) throw new Error(p + ': HTTP ' + res.status);
  return new Uint8Array(await res.arrayBuffer());
}

async function apply(targetHashKey, label) {
  clear();
  if (!/^https?:\/\/127\.0\.0\.1:\d+\/?$/.test(location.origin)) { out('Отказ: не 127.0.0.1 origin.', 'err'); return; }
  for (const f of FILES) {
    const cur = await readAll(f.rel);
    if (!cur) { out(f.rel + ': отсутствует в OPFS — отказ (пусть страницу установит обычная синхронизация).', 'err'); return; }
    const h = await sha256(cur);
    if (h !== f.orig && h !== f.traced) { out(f.rel + ': байты не совпадают ни с оригиналом, ни с трассой — отказ.', 'err'); return; }
  }
  for (const f of FILES) {
    const cur = await sha256(await readAll(f.rel));
    if (cur === f[targetHashKey]) { out(f.rel + ': уже ' + label + ', пропущен.'); continue; }
    const want = b64ToBytes(f[targetHashKey + 'B64']);
    const wh = await sha256(want);
    if (wh !== f[targetHashKey]) { out(f.rel + ': встроенные байты не совпадают с хешем — запись отменена.', 'err'); return; }
    await writeAll(f.rel, want);
    out(f.rel + ': записано ' + label + ' (' + wh.slice(0, 12) + ').');
  }
  out('Готово: ' + label + '.', 'ok');
}
$('sync').onclick = () => apply('traced', 'трассировано').catch(e => out('Ошибка: ' + e.message, 'err'));
$('revert').onclick = () => apply('orig', 'оригинал').catch(e => out('Ошибка: ' + e.message, 'err'));

async function tailLog(name) {
  clear();
  const b = await readAll(name);
  if (!b) { out(name + ': в OPFS нет.', 'err'); return; }
  const text = new TextDecoder('latin1').decode(b);
  const lines = text.split(/\r?\n/);
  out(name + ': ' + b.length + ' байт, строк: ' + lines.length + '; последние 80:');
  out(lines.slice(-80).join('\n'));
}
$('log').onclick = () => tailLog('system.log').catch(e => out('Ошибка: ' + e.message, 'err'));
$('clog').onclick = () => tailLog('compile.log').catch(e => out('Ошибка: ' + e.message, 'err'));
